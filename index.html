<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>個人財務與存錢小幫手</title>
    <link rel="apple-touch-icon" href="E6F7D494-A5D0-44C3-B23D-929F7C94E55D.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4facfe">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="財務小幫手">
    
    <style>
       
:root {
    --bg-color: #F8F4EC;
    --card-bg: #FFFDF8;
    --text-color: #51483F;
    --text-secondary: #9A8D7D;
    --border-color: #EEE5D8;
    --input-bg: #F9F5ED;

    --accent: #C9A982;
    --accent-dark: #AD8D68;
    --sage: #A9B99C;
    --sage-dark: #879D7B;
    --rose: #D9A6A0;

    --shadow-soft: 0 8px 24px rgba(120, 99, 72, 0.08);
}

[data-theme="dark"] {
    --bg-color: #282722;
    --card-bg: #35332D;
    --text-color: #F4EDE1;
    --text-secondary: #B8AC9B;
    --border-color: #4A463D;
    --input-bg: #403D35;

    --accent: #C9A982;
    --accent-dark: #B79772;
    --sage: #879D7B;
    --sage-dark: #718968;
    --rose: #D9A6A0;

    --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.15);
}

* {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", sans-serif;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.25s, color 0.25s,
        border-color 0.25s;
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px 14px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
}

.container {
    background: var(--card-bg);
    width: 100%;
    max-width: 500px;
    border-radius: 26px;
    padding: 22px;
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-color);
}

/* 主題切換 */
.theme-btn {
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
}

/* 總資產卡片 */
.dashboard-card {
    background: linear-gradient(135deg, #D8C2A5, #AAB99F);
    color: #fffdf8;
    border-radius: 22px;
    padding: 25px 20px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(170, 153, 120, 0.2);
    position: relative;
}

.total-amount {
    font-size: 36px;
    font-weight: 800;
    margin: 10px 0;
    letter-spacing: -1px;
}

.target-info {
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.35);
    padding-top: 12px;
}

.btn-edit-target {
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.5);
    color: white;
    padding: 5px 10px;
    border-radius: 10px;
    font-size: 11px;
    cursor: pointer;
    font-weight: 600;
}

.progress-bar-container {
    background: rgba(255,255,255,0.3);
    border-radius: 10px;
    height: 9px;
    width: 100%;
    margin-top: 12px;
    overflow: hidden;
}

.progress-bar {
    background: #FFFDF8;
    height: 100%;
    width: 0%;
    border-radius: 10px;
    transition: width 0.6s ease;
}

/* 功能區塊 */
.section {
    background: var(--bg-color);
    border-radius: 19px;
    padding: 17px;
    border: 1px solid var(--border-color);
}

.section h3 {
    font-size: 15px;
    margin: 0 0 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    color: var(--text-color);
    font-weight: 800;
}

/* 表單 */
.form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

input, select {
    width: 100%;
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    font-size: 14px;
    background: var(--input-bg);
    color: var(--text-color);
    outline: none;
}

input::placeholder {
    color: var(--text-secondary);
    opacity: 0.8;
}

input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201, 169, 130, 0.15);
}

/* 按鈕 */
button {
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: white;
    transition: transform 0.15s, opacity 0.2s;
}

button:active {
    transform: scale(0.97);
}

.btn-green {
    background: var(--sage);
    color: #fff;
}

.btn-green:hover {
    background: var(--sage-dark);
}

.btn-red {
    background: var(--rose);
    color: white;
}

.btn-blue {
    background: var(--accent);
    color: white;
    width: 100%;
}

.btn-blue:hover {
    background: var(--accent-dark);
}

/* 股票統計 */
.stock-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    background: var(--card-bg);
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 14px;
    font-size: 12px;
    border: 1px solid var(--border-color);
}

.stock-stats div {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.stock-stats b {
    font-size: 17px;
    margin-top: 2px;
}

/* 清單 */
.list {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 220px;
    overflow-y: auto;
}

.list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
}

.list-item:last-child {
    border-bottom: none;
}

.item-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}

.icon-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    padding: 4px;
    font-size: 14px;
    cursor: pointer;
}

.icon-btn:hover {
    opacity: 1;
}

.text-plus {
    color: #7E9C72;
    font-weight: 800;
}

.text-minus {
    color: #D68C86;
    font-weight: 800;
}

.link-text {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
}

.empty-tip {
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    padding: 14px 0;
    margin: 0;
}

/* 彈跳視窗 */
.modal-overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(65, 55, 43, 0.45);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
}

.modal-box {
    background: var(--card-bg);
    width: 100%;
    max-width: 320px;
    border-radius: 23px;
    padding: 23px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.modal-box h3 {
    font-size: 18px;
    color: var(--text-color);
    margin: 0;
}

.modal-btns {
    display: flex;
    gap: 10px;
}

/* 重置按鈕 */
.btn-reset {
    background: transparent;
    border: none;
    color: #C98D86;
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    width: 100%;
    text-align: center;
    padding: 8px;
}

/* 頁尾 */
.footer-credit {
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text-secondary);
    opacity: 0.65;
    margin-top: 2px;
    padding-bottom: 4px;
    text-transform: uppercase;
}

/* 手機版 */
@media (max-width: 380px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 16px;
        border-radius: 20px;
        gap: 16px;
    }

    h2 {
        font-size: 17px;
    }

    .total-amount {
        font-size: 30px;
    }

    .section {
        padding: 13px;
    }

    .form-row {
        gap: 6px;
    }

    input, select {
        padding: 10px;
        font-size: 13px;
    }
}


    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h2>🐱 個人財務小幫手</h2>
        <button class="theme-btn" onclick="toggleTheme()">🌓 切換模式</button>
    </div>
    
    <!-- 總資產與目標面板 -->
    <div class="dashboard-card">
        <div style="font-size: 13px; opacity: 0.9;">總淨資產</div>
        <div class="total-amount" id="totalBalance">$0</div>
        
        <div class="target-info">
            <span id="targetText">目標：$100,000</span>
            <span id="diffText">還差：$100,000</span>
            <button class="btn-edit-target" onclick="openTargetModal()">✏️ 設定目標</button>
        </div>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- 多銀行帳戶管理 -->
    <div class="section">
        <h3><span>💳 銀行帳戶餘額</span> <button onclick="openAccModal()" style="font-size:11px; padding:6px 10px; width:auto;" class="btn-blue">+ 新增帳戶</button></h3>
        <ul class="list" id="accountList"></ul>
    </div>

    <!-- 一般收支 / 存提款 -->
    <div class="section">
        <h3>💰 一般收支 / 存提款</h3>
        <div class="form-row">
            <select id="accSelect">
                <option value="">請先新增帳戶</option>
            </select>
            <select id="txType">
                <option value="deposit">存入 (+)</option>
                <option value="withdraw">提領 (-)</option>
            </select>
        </div>
        <div class="form-row">
            <input type="text" id="txNote" placeholder="備註（例如：薪水、買午餐）">
            <input type="number" id="txAmount" placeholder="金額" min="1">
        </div>
        <button class="btn-green" style="width:100%; margin-bottom: 12px;" onclick="handleTransaction()">記一筆</button>
        
        <div style="font-size: 13px; font-weight: 600; margin-bottom: 6px;">近期的收支明細</div>
        <ul class="list" id="txHistoryList"></ul>
    </div>

    <!-- 股票交易損益記錄 -->
    <div class="section">
        <h3>📈 股票交易損益記錄</h3>
        <div class="stock-stats">
            <div><span>累積股票總損益</span><b id="stockTotalPnl">$0</b></div>
            <div><span>勝率 (獲利/總筆數)</span><b id="stockWinRate">0% (0/0)</b></div>
        </div>
        <div class="form-row">
            <input type="text" id="stockName" placeholder="股票名稱/代號 (例如: 台積電)">
            <input type="number" id="stockPnl" placeholder="損益金額 (+賺/-賠)">
        </div>
        <div class="form-row">
            <select id="stockAccSelect">
                <option value="">請先新增帳戶</option>
            </select>
            <button class="btn-blue" onclick="handleStockTrade()">記錄損益並更新帳戶</button>
        </div>
        <ul class="list" id="stockList" style="margin-top: 10px;"></ul>
    </div>

    <!-- 清除重置按鈕 -->
    <div>
        <button class="btn-reset" onclick="resetAllData()">🗑️ 清空所有資料並重置</button>
    </div>
    <!-- 頁尾署名 -->
    <div class="footer-credit">DESIGN BY VIVIAN</div>

</div> 


</div>

<!-- 1. 設定目標金額彈窗 -->
<div class="modal-overlay" id="targetModal">
    <div class="modal-box">
        <h3>設定新目標金額</h3>
        <input type="number" id="newTargetInput" placeholder="請輸入金額 (NT$)">
        <div class="modal-btns">
            <button class="btn-red" style="flex:1;" onclick="closeModal('targetModal')">取消</button>
            <button class="btn-green" style="flex:1;" onclick="saveTargetGoal()">確定</button>
        </div>
    </div>
</div>

<!-- 2. 新增/編輯銀行帳戶彈窗 -->
<div class="modal-overlay" id="accModal">
    <div class="modal-box">
        <h3 id="accModalTitle">新增銀行帳戶</h3>
        <input type="hidden" id="editAccId">
        <input type="text" id="newAccName" placeholder="帳戶名稱 (例如：Richart)">
        <input type="number" id="newAccBalance" placeholder="當前餘額" value="0">
        <div class="modal-btns">
            <button class="btn-red" style="flex:1;" onclick="closeModal('accModal')">取消</button>
            <button class="btn-green" style="flex:1;" onclick="saveAccount()">儲存</button>
        </div>
    </div>
</div>

<!-- 3. 編輯收支紀錄彈窗 -->
<div class="modal-overlay" id="txEditModal">
    <div class="modal-box">
        <h3>編輯收支紀錄</h3>
        <input type="hidden" id="editTxId">
        <select id="editTxType">
            <option value="deposit">存入 (+)</option>
            <option value="withdraw">提領 (-)</option>
        </select>
        <input type="text" id="editTxNote" placeholder="備註">
        <input type="number" id="editTxAmount" placeholder="金額">
        <div class="modal-btns">
            <button class="btn-red" style="flex:1;" onclick="closeModal('txEditModal')">取消</button>
            <button class="btn-green" style="flex:1;" onclick="saveEditedTransaction()">儲存修改</button>
        </div>
    </div>
</div>

<!-- 4. 編輯股票交易紀錄彈窗 -->
<div class="modal-overlay" id="stockEditModal">
    <div class="modal-box">
        <h3>編輯股票交易紀錄</h3>
        <input type="hidden" id="editStockId">
        <input type="text" id="editStockName" placeholder="股票名稱/代號">
        <input type="number" id="editStockPnl" placeholder="損益金額 (+賺/-賠)">
        <select id="editStockAccSelect"></select>
        <div class="modal-btns">
            <button class="btn-red" style="flex:1;" onclick="closeModal('stockEditModal')">取消</button>
            <button class="btn-green" style="flex:1;" onclick="saveEditedStockTrade()">儲存修改</button>
        </div>
    </div>
</div>

<script>
    // 主題切換邏輯
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    }
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    let defaultData = {
        targetGoal: 100000,
        accounts: [],
        transactions: [],
        stocks: []
    };

    let appData = JSON.parse(localStorage.getItem('finance_app_data')) || defaultData;
    if (!appData.transactions) appData.transactions = [];

    function saveData() {
        localStorage.setItem('finance_app_data', JSON.stringify(appData));
        renderUI();
    }

    function resetAllData() {
        if (confirm("確定要清空所有帳戶、交易與股票紀錄嗎？這將無法復原。")) {
            localStorage.removeItem('finance_app_data');
            appData = JSON.parse(JSON.stringify(defaultData));
            renderUI();
        }
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // --- 目標金額 ---
    function openTargetModal() {
        document.getElementById('newTargetInput').value = appData.targetGoal || 100000;
        document.getElementById('targetModal').style.display = 'flex';
    }

    function saveTargetGoal() {
        let val = parseFloat(document.getElementById('newTargetInput').value);
        if (isNaN(val) || val < 0) { alert('請輸入有效的數字金額！'); return; }
        appData.targetGoal = val;
        closeModal('targetModal');
        saveData();
    }

    // --- 銀行帳戶 ---
    function openAccModal(accId = null) {
        if (accId) {
            let acc = appData.accounts.find(a => a.id === accId);
            if (!acc) return;
            document.getElementById('accModalTitle').innerText = '編輯銀行帳戶';
            document.getElementById('editAccId').value = acc.id;
            document.getElementById('newAccName').value = acc.name;
            document.getElementById('newAccBalance').value = acc.balance;
        } else {
            document.getElementById('accModalTitle').innerText = '新增銀行帳戶';
            document.getElementById('editAccId').value = '';
            document.getElementById('newAccName').value = '';
            document.getElementById('newAccBalance').value = '0';
        }
        document.getElementById('accModal').style.display = 'flex';
    }

    function saveAccount() {
        let editId = document.getElementById('editAccId').value;
        let name = document.getElementById('newAccName').value.trim();
        let balance = parseFloat(document.getElementById('newAccBalance').value) || 0;

        if (!name) { alert('請輸入帳戶名稱！'); return; }

        if (editId) {
            let acc = appData.accounts.find(a => a.id === editId);
            if (acc) {
                acc.name = name;
                acc.balance = balance;
            }
        } else {
            appData.accounts.push({
                id: Date.now().toString(),
                name: name,
                balance: balance
            });
        }

        closeModal('accModal');
        saveData();
    }

    function deleteAccount(accId) {
        if (confirm("確定要刪除這個帳戶嗎？")) {
            appData.accounts = appData.accounts.filter(a => a.id !== accId);
            saveData();
        }
    }

    // --- 收支紀錄 ---
    function openTxEditModal(txId) {
        let tx = appData.transactions.find(t => t.id === txId);
        if (!tx) return;
        
        document.getElementById('editTxId').value = tx.id;
        document.getElementById('editTxType').value = tx.type;
        document.getElementById('editTxNote').value = tx.note;
        document.getElementById('editTxAmount').value = tx.amount;
        
        document.getElementById('txEditModal').style.display = 'flex';
    }

    function saveEditedTransaction() {
        let txId = document.getElementById('editTxId').value;
        let newType = document.getElementById('editTxType').value;
        let newNote = document.getElementById('editTxNote').value.trim() || (newType === 'deposit' ? '存入' : '提領');
        let newAmount = parseFloat(document.getElementById('editTxAmount').value);

        if (isNaN(newAmount) || newAmount <= 0) { alert('請輸入有效金額！'); return; }

        let tx = appData.transactions.find(t => t.id === txId);
        if (!tx) return;

        let account = appData.accounts.find(a => a.id === tx.accId);
        if (account) {
            if (tx.type === 'deposit') account.balance -= tx.amount;
            else account.balance += tx.amount;

            if (newType === 'deposit') account.balance += newAmount;
            else account.balance -= newAmount;
        }

        tx.type = newType;
        tx.note = newNote;
        tx.amount = newAmount;

        closeModal('txEditModal');
        saveData();
    }

    function deleteTransaction(txId) {
        let tx = appData.transactions.find(t => t.id === txId);
        if (!tx) return;
        
        let account = appData.accounts.find(a => a.id === tx.accId);
        if (account) {
            if (tx.type === 'deposit') account.balance -= tx.amount;
            else account.balance += tx.amount;
        }

        appData.transactions = appData.transactions.filter(t => t.id !== txId);
        saveData();
    }

    // --- 股票紀錄 ---
    function openStockEditModal(stId) {
        let st = appData.stocks.find(s => s.id === stId);
        if (!st) return;

        document.getElementById('editStockId').value = st.id;
        document.getElementById('editStockName').value = st.name;
        document.getElementById('editStockPnl').value = st.pnl;

        const select = document.getElementById('editStockAccSelect');
        select.innerHTML = '';
        appData.accounts.forEach(acc => {
            let opt = document.createElement('option');
            opt.value = acc.id;
            opt.innerText = acc.name;
            if (acc.id === st.accId) opt.selected = true;
            select.appendChild(opt);
        });

        document.getElementById('stockEditModal').style.display = 'flex';
    }

    function saveEditedStockTrade() {
        let stId = document.getElementById('editStockId').value;
        let newName = document.getElementById('editStockName').value.trim();
        let newPnl = parseFloat(document.getElementById('editStockPnl').value);
        let newAccId = document.getElementById('editStockAccSelect').value;

        if (!newName || isNaN(newPnl)) { alert('請填寫完整內容與正確金額！'); return; }

        let st = appData.stocks.find(s => s.id === stId);
        if (!st) return;

        let oldAccount = appData.accounts.find(a => a.id === st.accId);
        if (oldAccount) oldAccount.balance -= st.pnl;

        let newAccount = appData.accounts.find(a => a.id === newAccId);
        if (newAccount) newAccount.balance += newPnl;

        st.name = newName;
        st.pnl = newPnl;
        st.accId = newAccId;

        closeModal('stockEditModal');
        saveData();
    }

    function deleteStockTrade(stId) {
        let st = appData.stocks.find(s => s.id === stId);
        if (!st) return;

        let account = appData.accounts.find(a => a.id === st.accId);
        if (account) account.balance -= st.pnl;

        appData.stocks = appData.stocks.filter(s => s.id !== stId);
        saveData();
    }

    // --- UI 渲染 ---
    function renderUI() {
        let totalAsset = appData.accounts.reduce((sum, acc) => sum + acc.balance, 0);
        document.getElementById('totalBalance').innerText = `$${totalAsset.toLocaleString()}`;

        let goal = appData.targetGoal || 100000;
        let diff = goal - totalAsset;
        let percent = Math.min(Math.max((totalAsset / goal) * 100, 0), 100);
        
        document.getElementById('targetText').innerText = `目標：$${goal.toLocaleString()}`;
        document.getElementById('diffText').innerText = diff > 0 ? `還差：$${diff.toLocaleString()}` : `已達成目標！🎉`;
        document.getElementById('progressBar').style.width = `${percent}%`;

        const accList = document.getElementById('accountList');
        const accSelect = document.getElementById('accSelect');
        const stockAccSelect = document.getElementById('stockAccSelect');
        
        accList.innerHTML = '';
        accSelect.innerHTML = '';
        stockAccSelect.innerHTML = '';

        if (appData.accounts.length === 0) {
            accList.innerHTML = '<p class="empty-tip">尚未建立帳戶，請點擊上方「+ 新增帳戶」</p>';
            let opt = document.createElement('option');
            opt.value = ""; opt.innerText = "請先新增帳戶";
            accSelect.appendChild(opt);
            stockAccSelect.appendChild(opt.cloneNode(true));
        } else {
            appData.accounts.forEach(acc => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.innerHTML = `
                    <span><b>${acc.name}</b></span>
                    <div class="item-actions">
                        <b>$${acc.balance.toLocaleString()}</b>
                        <button class="icon-btn" onclick="openAccModal('${acc.id}')" title="編輯">✏️</button>
                        <button class="icon-btn" onclick="deleteAccount('${acc.id}')" title="刪除">🗑️</button>
                    </div>
                `;
                accList.appendChild(li);

                let opt1 = document.createElement('option');
                opt1.value = acc.id; opt1.innerText = acc.name;
                accSelect.appendChild(opt1);

                let opt2 = document.createElement('option');
                opt2.value = acc.id; opt2.innerText = acc.name;
                stockAccSelect.appendChild(opt2);
            });
        }

        const txHistoryList = document.getElementById('txHistoryList');
        txHistoryList.innerHTML = '';
        if (appData.transactions.length === 0) {
            txHistoryList.innerHTML = '<p class="empty-tip">尚無收支明細</p>';
        } else {
            appData.transactions.slice().reverse().forEach(tx => {
                const accObj = appData.accounts.find(a => a.id === tx.accId);
                const accName = accObj ? accObj.name : '未知帳戶';
                const isDeposit = tx.type === 'deposit';
                const li = document.createElement('li');
                li.className = 'list-item';
                li.innerHTML = `
                    <div>
                        <div><b>${tx.note}</b></div>
                        <div class="link-text">${accName} | ${tx.date}</div>
                    </div>
                    <div class="item-actions">
                        <span class="${isDeposit ? 'text-plus' : 'text-minus'}">${isDeposit ? '+' : '-'}$${tx.amount.toLocaleString()}</span>
                        <button class="icon-btn" onclick="openTxEditModal('${tx.id}')">✏️</button>
                        <button class="icon-btn" onclick="deleteTransaction('${tx.id}')">🗑️</button>
                    </div>
                `;
                txHistoryList.appendChild(li);
            });
        }

        let stockTotalPnl = appData.stocks.reduce((sum, st) => sum + st.pnl, 0);
        let totalTrades = appData.stocks.length;
        let winTrades = appData.stocks.filter(st => st.pnl > 0).length;
        let winRate = totalTrades > 0 ? Math.round((winTrades / totalTrades) * 100) : 0;

        let pnlEl = document.getElementById('stockTotalPnl');
        pnlEl.innerText = `${stockTotalPnl >= 0 ? '+' : ''}$${stockTotalPnl.toLocaleString()}`;
        pnlEl.className = stockTotalPnl >= 0 ? 'text-plus' : 'text-minus';

        document.getElementById('stockWinRate').innerText = `${winRate}% (${winTrades}/${totalTrades})`;

        const stockList = document.getElementById('stockList');
        stockList.innerHTML = '';
        if (appData.stocks.length === 0) {
            stockList.innerHTML = '<p class="empty-tip">尚無股票交易紀錄</p>';
        } else {
            appData.stocks.slice().reverse().forEach(st => {
                const accObj = appData.accounts.find(a => a.id === st.accId);
                const accName = accObj ? accObj.name : '未知帳戶';
                const li = document.createElement('li');
                li.className = 'list-item';
                let isProfit = st.pnl >= 0;
                li.innerHTML = `
                    <div>
                        <div><b>${st.name}</b></div>
                        <div class="link-text">入帳戶：${accName} | ${st.date}</div>
                    </div>
                    <div class="item-actions">
                        <span class="${isProfit ? 'text-plus' : 'text-minus'}">${isProfit ? '+' : ''}$${st.pnl.toLocaleString()}</span>
                        <button class="icon-btn" onclick="openStockEditModal('${st.id}')">✏️</button>
                        <button class="icon-btn" onclick="deleteStockTrade('${st.id}')">🗑️</button>
                    </div>
                `;
                stockList.appendChild(li);
            });
        }
    }

    function handleTransaction() {
        let accId = document.getElementById('accSelect').value;
        if (!accId) { alert('請先選擇或新增帳戶！'); return; }
        
        let type = document.getElementById('txType').value;
        let note = document.getElementById('txNote').value.trim() || (type === 'deposit' ? '存入' : '提領');
        let amount = parseFloat(document.getElementById('txAmount').value);

        if (isNaN(amount) || amount <= 0) { alert('請輸入有效金額！'); return; }
        let account = appData.accounts.find(a => a.id === accId);
        if (!account) return;

        if (type === 'deposit') account.balance += amount;
        else account.balance -= amount;

        let now = new Date();
        let dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        appData.transactions.push({
            id: Date.now().toString(),
            accId: accId,
            type: type,
            note: note,
            amount: amount,
            date: dateStr
        });

        document.getElementById('txNote').value = '';
        document.getElementById('txAmount').value = '';
        saveData();
    }

    function handleStockTrade() {
        let name = document.getElementById('stockName').value.trim();
        let pnl = parseFloat(document.getElementById('stockPnl').value);
        let accId = document.getElementById('stockAccSelect').value;

        if (!accId) { alert('請先建立並選擇對應的銀行帳戶！'); return; }
        if (!name || isNaN(pnl)) { alert('請填寫完整的股票名稱與正確的損益金額！'); return; }
        
        let account = appData.accounts.find(a => a.id === accId);
        if (!account) { alert('找不到對應的帳戶！'); return; }

        account.balance += pnl;
        let now = new Date();
        let dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        appData.stocks.push({
            id: Date.now().toString(),
            name: name,
            pnl: pnl,
            accId: accId,
            date: dateStr
        });

        document.getElementById('stockName').value = '';
        document.getElementById('stockPnl').value = '';
        saveData();
    }

    renderUI();
</script>

</body>
</html>
